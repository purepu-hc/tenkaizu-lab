<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="立方体・直方体・三角柱・円柱などの展開図をすべて一覧し、3Dで折りたたんで確かめられる中学受験向けシミュレーター">
<title>展開図ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: workbench — solid shelf on top, 3D stage on graph paper, control bar below; nets panel = side column (wide) / bottom sheet (phone) */
:root{
  --bg:#e9eef4; --panel:#ffffff; --paper:#fbfcfe; --grid:#dde5ef; --ink:#1b2532; --muted:#5b6878; --line:#cdd7e3;
  --accent:#2c6cc4; --accent-ink:#ffffff; --soft:#e3ecf8;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --panel:#161d27; --paper:#131a23; --grid:#202b39; --ink:#e5ebf2; --muted:#98a6b7; --line:#2a3546;
  --accent:#78a9ff; --accent-ink:#0f141b; --soft:#1d2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --panel:#161d27; --paper:#131a23; --grid:#202b39; --ink:#e5ebf2; --muted:#98a6b7; --line:#2a3546;
  --accent:#78a9ff; --accent-ink:#0f141b; --soft:#1d2a3d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
.app{max-width:1240px;margin:0 auto;padding-block:14px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:960px){.app{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.main{display:flex;flex-direction:column;gap:12px;min-width:0}
header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:13px}

/* solid shelf */
.shelf{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.solid{flex:0 0 auto;width:88px;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:6px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.solid svg{width:56px;height:52px}
.solid span{font-size:13px;font-weight:700;white-space:nowrap}
.solid[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:1/1;max-height:60vh;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
@media (min-width:960px){.stage{aspect-ratio:auto;height:min(64vh,620px);max-height:none}}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.tag{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:3px 4px;font-weight:700}
.tag .t{padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{appearance:none;border:0;background:var(--soft);width:30px;height:30px;border-radius:99px;cursor:pointer;font-size:16px;line-height:1}
.facts{position:absolute;right:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 10px;font-size:12px;color:var(--muted)}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:2px 9px;pointer-events:none}
.open-nets{position:absolute;right:10px;bottom:10px;appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:900;border-radius:99px;padding:7px 14px;cursor:pointer}
@media (min-width:960px){.open-nets{display:none}}

/* control bar */
.bar{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:16px;border-radius:12px;padding:9px 14px;min-width:96px;cursor:pointer}
.slider{flex:1;min-width:160px;display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.pct{font-variant-numeric:tabular-nums;width:3.2em;text-align:right;font-weight:900}
.stops{display:flex;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>b{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.note{margin:0;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* nets panel */
.nets{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.nets-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.nets-head h2{margin:0;font-size:17px;font-weight:900}
.nets-head small{color:var(--muted);font-weight:700;margin-left:6px}
.close{display:inline-flex}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:12px;overflow-y:auto}
.cell{appearance:none;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:4px 4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.cell svg{width:100%;height:64px}
.cell span{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cell[aria-current="true"]{border-color:var(--accent);background:var(--soft)}
.cell[aria-current="true"] span{color:var(--accent)}
@media (min-width:960px){.nets{position:sticky;top:14px;max-height:calc(100vh - 28px)} .close{display:none}}
@media (max-width:959px){
  .nets{position:fixed;left:0;right:0;bottom:0;z-index:30;border-radius:20px 20px 0 0;max-height:72vh;
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
    transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .nets.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:29}
}
@media (min-width:960px){.scrim{display:none!important}}
@media (prefers-reduced-motion:reduce){.nets{transition:none}}
</style>
</head>
<body>


<div class="app">
  <div class="main">
    <header><h1>展開図ラボ</h1><p>立体をえらぶ → 展開図をえらぶ → 折ってみよう</p></header>
    <nav class="shelf" id="shelf" aria-label="立体"></nav>
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="展開図の3D表示"></canvas>
      <div class="tag"><button class="icon-btn" id="prev" type="button" aria-label="前の展開図">‹</button><span class="t" id="netLabel">—</span><button class="icon-btn" id="next" type="button" aria-label="次の展開図">›</button></div>
      <div class="facts" id="facts"></div>
      <div class="hint">タップでしるし・ドラッグで回転</div>
      <button class="open-nets" id="openNets" type="button">展開図をえらぶ</button>
    </div>
    <section class="bar" aria-label="操作">
      <div class="row">
        <button class="play" id="play" type="button">▶ 折る</button>
        <div class="slider"><input type="range" id="t" min="0" max="1000" value="0" aria-label="折りぐあい"><span class="pct" id="pct">0%</span></div>
        <div class="stops"><button class="chip" data-stop="0" type="button">0%</button><button class="chip" data-stop="0.5" type="button">50%</button><button class="chip" data-stop="1" type="button">100%</button></div>
      </div>
      <div class="row">
        <div class="grp"><b>折りかた</b><button class="chip" id="mAll" type="button" aria-pressed="true">いっしょに</button><button class="chip" id="mSeq" type="button" aria-pressed="false">じゅんばんに</button></div>
        <div class="grp"><b>速さ</b><button class="chip" data-speed="8" type="button" aria-pressed="false">ゆっくり</button><button class="chip" data-speed="4" type="button" aria-pressed="true">ふつう</button><button class="chip" data-speed="2" type="button" aria-pressed="false">はやい</button></div>
      </div>
      <div class="row">
        <div class="grp" id="colorGrp"><b>色</b><button class="chip" id="cKind" type="button">面の形</button><button class="chip" id="cPair" type="button">向かい合う面</button></div>
        <div class="grp" id="numGrp"><b>文字</b><button class="chip" id="numBtn" type="button" aria-pressed="false">番号</button></div>
        <div class="grp"><b>視点</b><button class="chip" id="vTilt" type="button">ななめ</button><button class="chip" id="vTop" type="button">真上</button><button class="chip" id="vSide" type="button">横</button></div>
        <div class="grp"><b>しるし</b><button class="chip" id="partnerBtn" type="button" aria-pressed="true">重なる相手も光らせる</button><button class="chip" id="clearMarks" type="button">しるしを消す</button></div>
      </div>
      <p class="note" id="note"></p>
    </section>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="nets" id="nets" aria-label="展開図の一覧">
    <div class="nets-head"><h2 id="netsTitle">展開図</h2><button class="icon-btn close" id="closeNets" type="button" aria-label="とじる">✕</button></div>
    <div class="grid" id="grid"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Net engine: solids, spanning-tree enumeration, unfolding, dedupe =====
const NetCore = (() => {
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
    mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
    cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
    len=a=>Math.sqrt(dot(a,a)), norm=a=>mul(a,1/len(a));

  function makeSolid(V, F, opt={}) {
    const c0 = mul(V.reduce(add,[0,0,0]), 1/V.length);
    const faces = F.map(f=>{
      let vs=f.slice();
      let n=norm(cross(sub(V[vs[1]],V[vs[0]]),sub(V[vs[2]],V[vs[0]])));
      const fc=mul(vs.map(i=>V[i]).reduce(add,[0,0,0]),1/vs.length);
      if(dot(n,sub(fc,c0))<0){vs.reverse(); n=mul(n,-1);}
      return {v:vs,n,c:fc};
    });
    // edges -> faces
    const emap=new Map(), dual=[];
    faces.forEach((f,fi)=>f.v.forEach((a,k)=>{
      const b=f.v[(k+1)%f.v.length], key=a<b?a+','+b:b+','+a;
      if(emap.has(key)){const o=emap.get(key); dual.push({f:[o.fi,fi],e:[o.a,o.b]});} else emap.set(key,{fi,a,b});
    }));
    // face kinds by shape signature
    const sigs=[];
    faces.forEach(f=>{
      if(opt.kinds){f.kind=opt.kinds(f,faces.indexOf(f));return;}
      const L=f.v.map((a,k)=>len(sub(V[f.v[(k+1)%f.v.length]],V[a])).toFixed(3)).sort().join('|');
      let i=sigs.indexOf(L); if(i<0){sigs.push(L);i=sigs.length-1;} f.kind=i;
    });
    // opposite pairs
    let pairs=null;
    if(opt.pairs!==false){
      pairs=faces.map(()=>-1); let ok=true;
      faces.forEach((f,i)=>{const j=faces.findIndex(g=>dot(g.n,f.n)<-0.999); if(j<0) ok=false; else pairs[i]=j;});
      if(ok){const pid=faces.map(()=>-1);let k=0;faces.forEach((f,i)=>{if(pid[i]<0){pid[i]=k;pid[pairs[i]]=k;k++;}});pairs=pid;}
      else pairs=null;
    }
    return {V,faces,dual,pairs,group:opt.group||null};
  }

  // all spanning trees of the dual graph (as dual-edge index lists)
  function spanningTrees(S){
    const n=S.faces.length, E=S.dual, out=[];
    const pick=[];
    function find(p,x){while(p[x]!==x)x=p[x];return x;}
    function rec(i,parent){
      if(pick.length===n-1){out.push(pick.slice());return;}
      if(E.length-i < n-1-pick.length) return;
      const [a,b]=E[i].f, ra=find(parent,a), rb=find(parent,b);
      if(ra!==rb){const p2=parent.slice(); p2[ra]=rb; pick.push(i); rec(i+1,p2); pick.pop();}
      rec(i+1,parent);
    }
    rec(0,[...Array(n).keys()]);
    return out;
  }

  // unfold a tree into a 2D net
  function unfold(S, tree){
    const n=S.faces.length, adj=[...Array(n)].map(()=>[]);
    tree.forEach(ei=>{const d=S.dual[ei]; adj[d.f[0]].push({to:d.f[1],e:d.e}); adj[d.f[1]].push({to:d.f[0],e:d.e});});
    // root = tree center
    const ecc=f=>{const dist=Array(n).fill(-1);dist[f]=0;const q=[f];while(q.length){const x=q.shift();adj[x].forEach(y=>{if(dist[y.to]<0){dist[y.to]=dist[x]+1;q.push(y.to);}});}return Math.max(...dist);};
    let root=0,best=1e9; for(let f=0;f<n;f++){const e=ecc(f); if(e<best){best=e;root=f;}}
    const V=S.V, F=S.faces, pos=Array(n), parent=Array(n).fill(-1), hinge=Array(n), depth=Array(n).fill(0);
    {const f=F[root], o=V[f.v[0]], u=norm(sub(V[f.v[1]],o)), v=cross(u,f.n);
     pos[root]={}; f.v.forEach(i=>{const d=sub(V[i],o); pos[root][i]=[dot(d,u),dot(d,v)];});}
    const q=[root], seen=Array(n).fill(false); seen[root]=true;
    while(q.length){
      const p=q.shift();
      const pc=Object.values(pos[p]).reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]).map(x=>x/F[p].v.length);
      for(const {to:c,e} of adj[p]){ if(seen[c]) continue; seen[c]=true;
        const [i,j]=e, A=pos[p][i], B=pos[p][j];
        let E2=[B[0]-A[0],B[1]-A[1]]; const l2=Math.hypot(...E2); E2=[E2[0]/l2,E2[1]/l2];
        let P=[-E2[1],E2[0]]; if((pc[0]-A[0])*P[0]+(pc[1]-A[1])*P[1]>0) P=[-P[0],-P[1]];
        const e3=norm(sub(V[j],V[i]));
        pos[c]={};
        F[c].v.forEach(k=>{
          if(k===i){pos[c][k]=A;return;} if(k===j){pos[c][k]=B;return;}
          const d=sub(V[k],V[i]), t=dot(d,e3), h=len(sub(d,mul(e3,t)));
          pos[c][k]=[A[0]+t*E2[0]+h*P[0], A[1]+t*E2[1]+h*P[1]];
        });
        parent[c]=p; depth[c]=depth[p]+1;
        hinge[c]={a:A,b:B,ang:Math.acos(Math.max(-1,Math.min(1,dot(F[p].n,F[c].n)))),key:[i,j]};
        q.push(c);
      }
    }
    const polys=F.map((f,fi)=>f.v.map(k=>pos[fi][k]));
    return {root,parent,hinge,depth,polys,tree};
  }

  function overlaps(P,Q){
    const eps=1e-6;
    for(const poly of [P,Q]) for(let k=0;k<poly.length;k++){
      const a=poly[k], b=poly[(k+1)%poly.length], ax=[-(b[1]-a[1]), b[0]-a[0]];
      let p0=1e9,p1=-1e9,q0=1e9,q1=-1e9;
      P.forEach(p=>{const s=p[0]*ax[0]+p[1]*ax[1]; p0=Math.min(p0,s); p1=Math.max(p1,s);});
      Q.forEach(p=>{const s=p[0]*ax[0]+p[1]*ax[1]; q0=Math.min(q0,s); q1=Math.max(q1,s);});
      if(p1<=q0+eps||q1<=p0+eps) return false;
    }
    return true;
  }
  function valid(net){
    const P=net.polys;
    // quick bbox
    const bb=P.map(p=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});return [x0,y0,x1,y1];});
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
      const a=bb[i],b=bb[j]; if(a[2]<=b[0]+1e-6||b[2]<=a[0]+1e-6||a[3]<=b[1]+1e-6||b[3]<=a[1]+1e-6) continue;
      if(overlaps(P[i],P[j])) return false;
    }
    return true;
  }
  function signature(S, polys){
    let best=null;
    const cents=polys.map(p=>p.reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]).map(x=>x/p.length));
    polys.forEach(p=>p.forEach((a0,k)=>{
      const b0=p[(k+1)%p.length];
      for(const [a,b] of [[a0,b0],[b0,a0]]){ let dx=b[0]-a[0],dy=b[1]-a[1]; const l=Math.hypot(dx,dy); dx/=l; dy/=l;
      for(const r of [1,-1]){
        const s=cents.map((c,i)=>{const x=c[0]-a[0],y=c[1]-a[1];
          const X=Math.round((x*dx+y*dy)*100), Y=Math.round(r*(-x*dy+y*dx)*100);
          return S.faces[i].kind+':'+(X||0)+':'+(Y||0);}).sort().join(';');
        if(best===null||s<best) best=s;
      }}
    }));
    return best;
  }
  // rotate net polys so bbox is minimal & landscape; returns new polys + hinge coords rotated
  function orient(net){
    const pts=net.polys.flat(); let bestA=1e9, bestT=0;
    net.polys.forEach(p=>{if(p.length>6)return; p.forEach((a,k)=>{const b=p[(k+1)%p.length]; const t=-Math.atan2(b[1]-a[1],b[0]-a[0]);
      for(const tt of [t,t+Math.PI/2]){const c=Math.cos(tt),s=Math.sin(tt); let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
        pts.forEach(q=>{const x=q[0]*c-q[1]*s,y=q[0]*s+q[1]*c;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);});
        let A=(x1-x0)*(y1-y0); if(x1-x0<y1-y0-1e-6) A*=1.0001; if(A<bestA-1e-6){bestA=A;bestT=tt;}}});});
    const c=Math.cos(bestT),s=Math.sin(bestT), R=q=>[q[0]*c-q[1]*s,q[0]*s+q[1]*c];
    net.polys=net.polys.map(p=>p.map(R));
    net.hinge=net.hinge.map(h=>h?{...h,a:R(h.a),b:R(h.b)}:h);
    // bbox sanity: ensure landscape
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; net.polys.flat().forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
    if(y1-y0>x1-x0+1e-6){const RR=q=>[-q[1],q[0]]; net.polys=net.polys.map(p=>p.map(RR)); net.hinge=net.hinge.map(h=>h?{...h,a:RR(h.a),b:RR(h.b)}:h);}
    return net;
  }

  function allNets(S){
    const seen=new Set(), nets=[];
    for(const t of spanningTrees(S)){
      const net=unfold(S,t); if(!valid(net)) continue;
      const sg=signature(S,net.polys); if(seen.has(sg)) continue;
      seen.add(sg); nets.push(orient(net));
    }
    return nets;
  }
  function netFromTree(S, edgePairs){ // edgePairs: [[faceA,faceB],...]
    const tree=edgePairs.map(([a,b])=>S.dual.findIndex(d=>(d.f[0]===a&&d.f[1]===b)||(d.f[0]===b&&d.f[1]===a)));
    return orient(unfold(S,tree));
  }

  // ---- solids ----
  function prism(base,h){ // base CCW 2D

  let bk=-1,bd=1e9; poly.forEach((p,k)=>{const d=Math.hypot(p[0]-pt[0],p[1]-pt[1]);if(d<bd){bd=d;bk=k;}});
  let mark;
  if(bd<vth){mark={type:'v',vid:V[bk],pos:poly[bk]};}
  else{let ek=-1,ed=1e9;
    for(let k=0;k<L;k++){const p=poly[k],q=poly[(k+1)%L],dx=q[0]-p[0],dy=q[1]-p[1],t=clamp(((pt[0]-p[0])*dx+(pt[1]-p[1])*dy)/(dx*dx+dy*dy),0,1);
      const d=Math.hypot(p[0]+t*dx-pt[0],p[1]+t*dy-pt[1]);if(d<ed){ed=d;ek=k;}}
    const p=poly[ek],q=poly[(ek+1)%L]; mark={type:'e',key:edgeKey(V[ek],V[(ek+1)%L]),pos:[(p[0]+q[0])/2,(p[1]+q[1])/2]};}
  const same=state.marks.findIndex(m=>m.type===mark.type&&(m.type==='v'?m.vid===mark.vid:m.key===mark.key));
  if(same>=0){state.marks.splice(same,1);renderMarks();return;}
  const used=new Set(state.marks.map(m=>m.label)), cols=new Set(state.marks.map(m=>m.col));
  if(mark.type==='v'){for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){if(!used.has(c)){mark.label=c;break;}}}
  else{for(const c of '①②③④⑤⑥⑦⑧⑨⑩⑪⑫'){if(!used.has(c)){mark.label=c;break;}}}
  if(!mark.label) return;
  mark.col=MARK_COL.find(c=>!cols.has(c))||MARK_COL[state.marks.length%MARK_COL.length];
  state.marks.push(mark); renderMarks();
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const slider=$('t'),pct=$('pct'),playBtn=$('play'),grid=$('grid'),netsEl=$('nets'),scrim=$('scrim');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setT(v){state.t=clamp(v,0,1);slider.value=Math.round(state.t*1000);pct.textContent=Math.round(state.t*100)+'%';
  playBtn.textContent=state.target!==null?'❚❚ 止める':(state.t>=.999?'↺ ひらく':'▶ 折る');}
function press(el,on){el.setAttribute('aria-pressed',on?'true':'false');}

function renderShelf(){
  const shelf=$('shelf'); shelf.innerHTML='';
  SOLIDS.forEach(sd=>{prepare(sd);const b=document.createElement('button');b.type='button';b.className='solid';
    b.innerHTML=solidSVG(sd)+`<span>${sd.name}</span>`;press(b,sd===state.solid);
    b.onclick=()=>{if(sd!==state.solid) selectSolid(sd); openNets();};
    shelf.appendChild(b);});
}
function renderGrid(){
  const sd=state.solid;
  $('netsTitle').innerHTML=`${sd.name}の展開図<small>${sd.nets.length}種類</small>`;
  grid.innerHTML='';
  sd.nets.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='cell';
    b.innerHTML=netSVG(sd,n)+`<span>No.${i+1}</span>`; if(i===state.net) b.setAttribute('aria-current','true');
    b.onclick=()=>{selectNet(i);closeNets();}; grid.appendChild(b);});
}
function selectSolid(sd){
  prepare(sd); state.solid=sd; state.net=0; state.color=sd.S.pairs?sd.color:'kind';
  $('facts').textContent=sd.factsText;
  $('colorGrp').hidden=!sd.S.pairs; $('numGrp').hidden=!!sd.curved;
  $('numBtn').textContent=sd.id==='cube'?'サイコロの目':'番号';
  syncChips(); renderShelf(); selectNet(0);
}
function selectNet(i){
  const sd=state.solid; state.net=(i+sd.nets.length)%sd.nets.length; state.target=null; state.marks=[];
  buildScene(); setT(0);
  $('netLabel').textContent=`No.${state.net+1} / ${sd.nets.length}`;
  $('note').textContent=sd.tip;
  renderGrid();
  const cur=grid.querySelector('[aria-current="true"]'); if(cur&&matchMedia('(min-width:960px)').matches) cur.scrollIntoView({block:'nearest'});
}
function syncChips(){press($('cKind'),state.color==='kind');press($('cPair'),state.color==='pair');press($('numBtn'),state.num);
  press($('mAll'),!state.seq);press($('mSeq'),state.seq);
  document.querySelectorAll('[data-speed]').forEach(b=>press(b,+b.dataset.speed===state.speed));}
function openNets(){if(matchMedia('(min-width:960px)').matches)return;netsEl.classList.add('open');scrim.hidden=false;}
function closeNets(){netsEl.classList.remove('open');scrim.hidden=true;}

$('openNets').onclick=openNets; $('closeNets').onclick=closeNets; scrim.onclick=closeNets;
$('prev').onclick=()=>selectNet(state.net-1); $('next').onclick=()=>selectNet(state.net+1);
slider.addEventListener('input',()=>{state.target=null;setT(slider.value/1000);});
playBtn.onclick=()=>{
  if(state.target!==null){state.target=null;setT(state.t);return;}
  state.target=state.t>=.999?0:1; if(reduce){setT(state.target);state.target=null;} setT(state.t);};
document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>{state.target=+b.dataset.stop; if(reduce||Math.abs(state.target-state.t)<1e-3){setT(state.target);state.target=null;} setT(state.t);});
$('mAll').onclick=()=>{state.seq=false;syncChips();};
$('mSeq').onclick=()=>{state.seq=true;syncChips();};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{state.speed=+b.dataset.speed;syncChips();});
$('cKind').onclick=()=>{state.color='kind';syncChips();applyLook();renderGrid();renderShelf();};
$('cPair').onclick=()=>{state.color='pair';syncChips();applyLook();renderGrid();renderShelf();};
$('numBtn').onclick=()=>{state.num=!state.num;syncChips();applyLook();};
$('partnerBtn').onclick=()=>{state.partner=!state.partner;press($('partnerBtn'),state.partner);renderMarks();};
$('clearMarks').onclick=()=>{state.marks=[];renderMarks();};
const setView=v=>{viewAnim={from:[pitch,yaw],to:VIEWS[v],k:0};zoom=1;};
$('vTilt').onclick=()=>setView('tilt'); $('vTop').onclick=()=>setView('top'); $('vSide').onclick=()=>setView('side');
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')selectNet(state.net+1); if(e.key==='ArrowLeft')selectNet(state.net-1); if(e.key==='Escape')closeNets();});

// pointer: rotate / pinch zoom
const ptrs=new Map(); let drag=null,pinch=null;
let tap=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);viewAnim=null;
  tap=ptrs.size===1?{x:e.clientX,y:e.clientY,t:performance.now()}:null;
  if(ptrs.size===1) drag={x:e.clientX,y:e.clientY,yaw,pitch};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:zoom};drag=null;}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>=8)tap=null;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoom=clamp(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,.5,3);}
  else if(drag){yaw=drag.yaw+(e.clientX-drag.x)*.01;pitch=clamp(drag.pitch+(e.clientY-drag.y)*.01,-1.55,1.55);}});
const up=e=>{if(tap&&e.type==='pointerup'&&ptrs.size===1&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<8&&performance.now()-tap.t<500){const r=canvas.getBoundingClientRect();handleTap(e.clientX-r.left,e.clientY-r.top,r.width,r.height);}tap=null;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null;
  else if(ptrs.size===1){const [p]=[...ptrs.values()];drag={x:p[0],y:p[1],yaw,pitch};}};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.0015),.5,3);},{passive:false});

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(state.target!==null){const dir=Math.sign(state.target-state.t),nt=state.t+dir*dt/state.speed;
    if((dir>0&&nt>=state.target)||(dir<=0&&nt<=state.target)){const tg=state.target;state.target=null;setT(tg);} else setT(nt);}
  if(viewAnim){viewAnim.k=Math.min(1,viewAnim.k+dt*2.5);const e=ease(viewAnim.k);
    pitch=viewAnim.from[0]+(viewAnim.to[0]-viewAnim.from[0])*e; yaw=viewAnim.from[1]+(viewAnim.to[1]-viewAnim.from[1])*e; if(viewAnim.k>=1)viewAnim=null;}
  spin.rotation.set(pitch,yaw,0);
  pose(state.t);
  const R=fitFlat+(fitFold-fitFlat)*ease(state.t);
  const half=THREE.MathUtils.degToRad(camera.fov/2), aspectFix=Math.min(1,camera.aspect);
  camera.position.set(0,0,(R*1.12)/Math.sin(half)/aspectFix/zoom); camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
selectSolid(SOLIDS[0]); resize(); requestAnimationFrame(loop);
</script>
